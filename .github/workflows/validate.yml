name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate marketplace
        run: node scripts/validate.mjs
      - name: Validator tests
        run: node --test scripts/validate.test.mjs
      - name: README catalog is current
        run: node scripts/render-catalog.mjs --check
      - name: Smoke-test the starter MCP server
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node plugins/kcoder-starter/server/starter-mcp.mjs > mcp.out
          grep -q '"starter_echo"' mcp.out
